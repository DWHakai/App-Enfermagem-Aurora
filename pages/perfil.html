<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <title>Meu Perfil · Hospital Aurora Medical Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/app/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/paginas/perfil.js"></script>
</head>
<body class="protegida">
  <!-- Tela 10 - Perfil -->
  <main class="app">
    <header id="topo"></header>

    <section class="perfil-cabeca">
      <div class="avatar"><img src="/img/icones/usuario.svg" alt=""></div>
      <h2 id="nome"></h2>
      <p id="funcao"></p>
    </section>

    <dl class="dados">
      <div><dt>E-mail:</dt><dd id="email"></dd></div>
      <div><dt>Setor:</dt><dd id="setor"></dd></div>
      <div><dt>Plantão:</dt><dd id="plantao"></dd></div>
      <div><dt>Pacientes:</dt><dd id="pacientes"></dd></div>
    </dl>

    <details class="expansivel">
      <summary>Configurações</summary>
      <p><b>Instalar o app no celular</b><br>
        Android: no Chrome, toque nos três pontinhos e em "Instalar app".<br>
        iPhone: no Safari, toque em Compartilhar e em "Adicionar à Tela de Início".</p>
    </details>

    <div class="instalar" id="instalar" hidden>
      <button class="btn btn-secundario btn-normal" type="button" id="instalar-botao">
        <img src="/img/icones/mais.svg" alt="">Instalar o app no celular
      </button>
      <p class="dica" id="instalar-dica" aria-live="polite"></p>
    </div>

    <button class="btn btn-principal" type="button" id="sair">Sair</button>
  </main>
</body>
</html>
