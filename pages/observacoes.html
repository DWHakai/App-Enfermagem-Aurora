<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <title>Observações · Hospital Aurora Medical Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/app/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/paginas/observacoes.js"></script>
</head>
<body class="protegida">
  <!-- Tela 9 - Observações -->
  <main class="app">
    <header id="topo"></header>

    <form class="form" id="form" novalidate>
      <div class="bloco">
        <label for="texto">Nova observação</label>
        <textarea class="textarea" id="texto" name="texto" maxlength="2000" placeholder="Digite a observação..."></textarea>
      </div>
      <button class="btn btn-principal" type="submit">Salvar observação</button>
    </form>

    <h2 class="subtitulo">Anteriores</h2>
    <ul class="lista" id="lista"></ul>
  </main>
</body>
</html>
