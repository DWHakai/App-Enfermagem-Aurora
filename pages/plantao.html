<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <title>Evolução / Plantão · Hospital Aurora Medical Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/app/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/paginas/plantao.js"></script>
</head>
<body class="protegida">
  <!-- Tela 3 - Evolução / Plantão -->
  <main class="app">
    <header id="topo"></header>

    <h2 class="subtitulo">Último registro</h2>
    <ul class="lista" id="ultimos"></ul>

    <div class="abas">
      <button class="aba" type="button" id="aba-passagem">
        <img src="/img/icones/usuarios.svg" alt="">Passagem<br>de Plantão
      </button>
      <button class="aba" type="button" id="aba-evolucao">
        <img src="/img/icones/prancheta.svg" alt="">Evolução de<br>Enfermagem
      </button>
    </div>

    <form class="painel" id="form" novalidate>
      <div class="bloco">
        <label for="paciente">Paciente</label>
        <select class="select" id="paciente" name="paciente"></select>
      </div>

      <div class="bloco" id="bloco-passagem">
        <label for="passagem">Passagem de Plantão</label>
        <textarea class="textarea" id="passagem" name="passagem" maxlength="4000" placeholder="Digite as informações do plantão..."></textarea>
      </div>

      <div class="bloco">
        <label for="evolucao">Evolução de Enfermagem</label>
        <textarea class="textarea" id="evolucao" name="evolucao" maxlength="4000" placeholder="Digite a evolução..."></textarea>
      </div>

      <div class="data-hora">
        <label><img src="/img/icones/calendario.svg" alt="">Data: <input type="date" name="data"></label>
        <label><img src="/img/icones/relogio.svg" alt="">Horário: <input type="time" name="hora"></label>
      </div>

      <button class="btn btn-principal" type="submit"><img src="/img/icones/salvar.svg" alt="">Salvar</button>
    </form>
  </main>
</body>
</html>
