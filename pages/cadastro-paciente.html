<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F7FA">
  <title>Cadastro de Paciente · Grey's Anatomy Hospital</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/app/icone-app.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Poppins:wght@600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/paginas/cadastro-paciente.js"></script>
</head>
<body class="protegida">
  <!-- Tela 11 - Cadastro de Paciente -->
  <main class="app">
    <header id="topo"></header>

    <form class="form" id="form" novalidate>
      <label class="campo obrigatorio">
        <span>Nome completo<span class="obrig">*</span></span>
        <input class="input" name="nome" maxlength="100" placeholder="Ex.: Maria Aparecida Silva">
      </label>

      <div class="duas-colunas">
        <label class="campo obrigatorio">
          <span>Data de nascimento<span class="obrig">*</span></span>
          <input class="input" type="date" name="data_nasc">
        </label>
        <label class="campo">
          <span>Leito</span>
          <input class="input" name="leito" maxlength="10" placeholder="Ex.: 12">
        </label>
      </div>

      <label class="campo">
        <span>Nome da mãe</span>
        <input class="input" name="nome_mae" maxlength="100" placeholder="Nome completo da mãe">
      </label>

      <label class="campo">
        <span>Setor / Local</span>
        <select class="select" name="setor">
          <option value="">Selecione</option>
          <option>Clínica Médica - Ala A</option>
          <option>Clínica Médica - Ala B</option>
          <option>Pronto-Socorro</option>
          <option>UTI</option>
          <option>Pediatria</option>
          <option>Maternidade</option>
          <option>Centro Cirúrgico</option>
        </select>
      </label>

      <label class="campo">
        <span>Estado clínico</span>
        <!-- Precisa ser IGUAL à lista do banco (01-estrutura.sql, tabela pacientes) -->
        <select class="select" name="estado_clinico">
          <option value="">Selecione</option>
          <option>Estável</option>
          <option>Em observação</option>
          <option>Grave</option>
          <option>Crítico</option>
        </select>
      </label>

      <label class="campo">
        <span>Diagnóstico</span>
        <input class="input" name="diagnostico" maxlength="200" placeholder="Ex.: Pneumonia comunitária">
      </label>

      <label class="campo">
        <span>Alergias</span>
        <input class="input" name="alergias" maxlength="200" placeholder="Ex.: Penicilina, dipirona...">
      </label>

      <label class="campo sigilo">
        <span><img src="/img/icones/cadeado-rosa.svg" alt="">Informações sigilosas</span>
        <textarea class="textarea" name="info_sigilosa" maxlength="2000" placeholder="Doenças prévias, cirurgias, condições sensíveis..."></textarea>
        <small class="dica">Na ficha, esta parte fica fechada e só abre com um toque.</small>
      </label>

      <p class="dica-rosa">* Campos obrigatórios</p>
      <button class="btn btn-rosa" type="submit">Cadastrar paciente</button>
    </form>
  </main>
</body>
</html>
