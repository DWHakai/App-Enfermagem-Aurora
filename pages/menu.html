<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F7FA">
  <title>Menu · Grey's Anatomy Hospital</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/app/icone-app.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Poppins:wght@600&display=swap">

  <script type="module" src="/js/paginas/menu.js"></script>

<body class="protegida">
  <!-- Tela 2 - Menu -->
  <main class="app">
    <header id="topo"></header>

    <a class="banner-sa" href="/pages/setembro-amarelo.html">
      <img class="laco" src="/img/laco.svg" alt="">
      <div>
        <h2>Setembro Amarelo</h2>
        <p>Falar é o primeiro passo para a vida.</p>
      </div>
      <img class="coracao" src="/img/icones/coracao-rosa.svg" alt="">

    <label class="campo seletor-paciente" id="seletor">
      <span>Paciente em atendimento</span>
      <select class="select" id="paciente">
        <option value="">Selecione o paciente...</option>
      </select>

    <nav class="grade" aria-label="Telas do paciente">
      <a class="cartao rosa" href="/pages/paciente.html"><img src="/img/icones/usuario.svg" alt="">Paciente</a>
      <a class="cartao azul" href="/pages/sinais-vitais.html"><img src="/img/icones/coracao.svg" alt="">Sinais Vitais</a>

      <a class="cartao rosa" href="/pages/exames.html"><img src="/img/icones/documento.svg" alt="">Exames</a>
      <a class="cartao rosa" href="/pages/historico.html"><img src="/img/icones/curativo.svg" alt="">Histórico</a>
      <a class="cartao azul" href="/pages/observacoes.html"><img src="/img/icones/prancheta.svg" alt="">Observações</a>
    </nav>

    <a class="btn btn-rosa btn-normal" href="/pages/cadastro-paciente.html">+ Paciente</a>

</html>
