<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="Prontuário de enfermagem do Hospital Aurora Medical Center: passagem de plantão, evolução, sinais vitais e medicações.">
  <title>Entrar · Hospital Aurora Medical Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/app/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/paginas/login.js"></script>
</head>
<body>
  <!-- Tela 1 - Login -->
  <main class="app login">
    <img class="logo-grande" src="/img/logo.png" alt="">
    <div class="marca">
      <span class="marca-topo">HOSPITAL</span>
      <span class="marca-nome">AURORA</span>
      <span class="marca-sub">MEDICAL CENTER</span>
    </div>
    <p class="slogan">Cuidar também<br>é ciência.</p>

    <form class="form" id="form" novalidate>
      <label class="input-icone">
        <span class="escondido">E-mail</span>
        <img src="/img/icones/usuario.svg" alt="">
        <input class="input" type="email" name="email" maxlength="120" placeholder="Usuário (e-mail)" autocomplete="username">
      </label>
      <label class="input-icone">
        <span class="escondido">Senha</span>
        <img src="/img/icones/cadeado.svg" alt="">
        <input class="input" type="password" name="senha" maxlength="72" placeholder="Senha" autocomplete="current-password">
      </label>
      <button class="btn btn-principal" type="submit">Entrar</button>
    </form>

    <a class="link-simples" href="/pages/criar-conta.html">Não tem conta? <b>Criar conta</b></a>

    <div class="instalar" id="instalar" hidden>
      <button class="btn btn-secundario btn-normal" type="button" id="instalar-botao">
        <img src="/img/icones/mais.svg" alt="">Instalar o app no celular
      </button>
      <p class="dica" id="instalar-dica" aria-live="polite"></p>
    </div>

    <img class="batimento" src="/img/batimento.svg" alt="">
  </main>
</body>
</html>
