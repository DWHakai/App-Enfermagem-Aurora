<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F7FA">
  <meta name="description" content="Prontuário de enfermagem do Grey's Anatomy Hospital: passagem de plantão, evolução, sinais vitais e medicações.">
  <title>Entrar · Grey's Anatomy Hospital</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/app/icone-app.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Poppins:wght@600&display=swap">
  <link rel="stylesheet" href="/css/estilo.css">
  <script type="module" src="/js/paginas/login.js"></script>
</head>
<body>
  <!-- Tela 1 - Login -->
  <main class="app login">
    <img class="logo-grande" src="/img/logo.svg" alt="">
    <div class="marca">
      <span class="marca-greys">GREY'S</span>
      <span class="marca-anatomy">ANATOMY</span>
      <span class="marca-hospital">HOSPITAL</span>
    </div>
    <p class="slogan">Cuidar também<br>é ciência.</p>

    <form class="form" id="form" novalidate>
      <label class="input-icone">
        <span class="escondido">E-mail</span>
        <img src="/img/icones/usuario.svg" alt="">
        <input class="input" type="email" name="email" maxlength="120" placeholder="Usuário (e-mail)" autocomplete="username">
      </label>
      <label class="input-icone">
        <span class="escondido">Senha</span>
        <img src="/img/icones/cadeado.svg" alt="">
        <input class="input" type="password" name="senha" maxlength="72" placeholder="Senha" autocomplete="current-password">
      </label>
      <button class="btn btn-rosa" type="submit">Entrar</button>
    </form>

    <a class="link-simples" href="/pages/criar-conta.html">Não tem conta? <b>Criar conta</b></a>

    <img class="batimento" src="/img/batimento.svg" alt="">
  </main>
</body>
</html>
